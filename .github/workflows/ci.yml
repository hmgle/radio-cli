name: CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Keep npm artifacts out of the packaged crate
        run: |
          set -euo pipefail
          package_list=$(cargo package --list --locked --allow-dirty)
          if grep -q '^npm/' <<<"$package_list"; then
            echo 'crate package list unexpectedly contains npm files' >&2
            exit 1
          fi
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg mpv
      - run: cargo fmt --check
      - uses: astral-sh/setup-uv@v10
      - run: uv run --no-project --python 3.12 python tests/speech_worker.py
      - run: cargo clippy --all-targets --all-features --locked -- -D warnings
      - run: cargo test --all-targets --all-features --locked
      - run: cargo test --release --test storage catalog_benchmark -- --ignored --nocapture
  macos:
    name: macOS (${{ matrix.target }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            target: aarch64-apple-darwin
          - runner: macos-15-intel
            target: x86_64-apple-darwin
    runs-on: ${{ matrix.runner }}
    env:
      HOMEBREW_NO_AUTO_UPDATE: "1"
      RADIO_TEST_MPV: mpv
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
          targets: ${{ matrix.target }}
      - run: |
          brew install ffmpeg-full mpv gnu-tar
          echo "$(brew --prefix ffmpeg-full)/bin" >> "$GITHUB_PATH"
      - run: |
          mpv --version
          ffmpeg -version
          ffprobe -version
      - run: cargo clippy --all-targets --all-features --locked -- -D warnings
      - run: cargo test --all-targets --all-features --locked
      - run: scripts/package-release.sh "${{ matrix.target }}"
      - uses: actions/upload-artifact@v4
        with:
          name: package-${{ matrix.target }}
          path: target/dist/*.tar.gz
          if-no-files-found: error
  msrv:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.88.0
      - run: cargo check --all-targets --all-features --locked
  musl:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-musl
      - run: sudo apt-get update && sudo apt-get install -y musl-tools ffmpeg mpv
      - run: scripts/package-release.sh
      - uses: actions/upload-artifact@v4
        with:
          name: package-x86_64-unknown-linux-musl
          path: target/dist/*.tar.gz
          if-no-files-found: error
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo install cargo-audit --version 0.22.2 --locked
      - run: cargo audit
  release-artifacts:
    name: Verified release archives
    needs: [test, macos, msrv, musl, audit]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: package-*
          merge-multiple: true
          path: target/dist
      - name: Create combined checksums
        working-directory: target/dist
        run: |
          set -- radio-cli-*.tar.gz
          test "$#" -eq 3
          sha256sum "$@" > SHA256SUMS
          sha256sum -c SHA256SUMS
      - uses: actions/upload-artifact@v4
        with:
          name: release-archives
          path: target/dist/*
          if-no-files-found: error
