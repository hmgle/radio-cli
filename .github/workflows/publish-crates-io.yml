name: Publish to crates.io
on:
  release:
    types: [published]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: publish-crates-io
  cancel-in-progress: false
jobs:
  publish:
    # The environment name has to match the Trusted Publishing configuration on
    # crates.io. GitHub creates the environment on the first run if it does not
    # exist; create it beforehand to add protection rules such as required
    # reviewers.
    environment: release
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # Required for the OpenID Connect token exchange with crates.io.
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - name: Check that the release tag matches the crate version
        if: github.event_name == 'release'
        env:
          TAG_NAME: ${{ github.event.release.tag_name }}
        run: |
          version=$(cargo metadata --no-deps --locked --format-version 1 | jq -r '.packages[0].version')
          test "${TAG_NAME#v}" = "$version" || {
            echo "Release tag $TAG_NAME does not match crate version $version." >&2
            exit 1
          }
      - uses: dtolnay/rust-toolchain@stable
      - name: Exchange the workflow identity for a short-lived crates.io token
        id: auth
        uses: rust-lang/crates-io-auth-action@v1
      # cargo publish verifies the packaged crate by building it before upload.
      - name: Publish to crates.io
        run: cargo publish --locked
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
