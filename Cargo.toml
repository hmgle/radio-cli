[package]
name = "radio-cli"
version = "0.6.0"
edition = "2024"
description = "A lightweight terminal radio with local favorites and recordings"
license = "MIT"
repository = "https://github.com/hmgle/radio-cli"
rust-version = "1.88"

[[bin]]
name = "radio"
path = "src/main.rs"

[dependencies]
anyhow = "1"
chrono = { version = "0.4", default-features = false, features = ["clock", "serde"] }
clap = { version = "4", features = ["derive"] }
crossterm = "0.29"
directories = "6"
fs2 = "0.4"
hickory-resolver = "0.26.3"
libc = "0.2"
rand = "0.9"
ratatui = { version = "0.30.2", default-features = false, features = ["crossterm", "layout-cache"] }
# Newer Sixel dependencies require Rust 1.90; retain our Rust 1.88 baseline.
ratatui-image = { version = "=10.0.1", default-features = false, features = ["crossterm"] }
image = { version = "0.25.10", default-features = false, features = ["jpeg", "png"] }
sha2 = "0.10"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls", "gzip"] }
rusqlite = { version = "0.37", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
shell-words = "1"
signal-hook = "0.3"
toml = "0.9"
tokio = { version = "1", features = ["rt", "time", "sync", "macros"] }
unicode-width = "0.2"
uuid = { version = "1", features = ["v4", "serde"] }
clap_complete = "4"
clap_mangen = "0.2"
base64 = "0.22"

[dev-dependencies]
tempfile = "3"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
