[package]
name = "radio-cli"
version = "0.1.0"
edition = "2024"
description = "A lightweight terminal radio with local favorites and recordings"
license = "MIT"
rust-version = "1.88"

[[bin]]
name = "radio"
path = "src/main.rs"

[dependencies]
anyhow = "1"
chrono = { version = "0.4", default-features = false, features = ["clock", "serde"] }
clap = { version = "4", features = ["derive"] }
crossterm = "0.28"
directories = "6"
fs2 = "0.4"
hickory-resolver = "0.24"
libc = "0.2"
rand = "0.9"
ratatui = { version = "0.29", default-features = false, features = ["crossterm"] }
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls", "gzip"] }
rusqlite = { version = "0.37", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
shell-words = "1"
signal-hook = "0.3"
toml = "0.9"
unicode-width = "0.2"
uuid = { version = "1", features = ["v4", "serde"] }

[dev-dependencies]
tempfile = "3"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
