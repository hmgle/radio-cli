# Optional; omitted values use these defaults.
mpv = "mpv"
ffmpeg = "ffmpeg"
ffprobe = "ffprobe"
volume = 80
# Resume the last TUI station and source; volume is always remembered.
resume = false
# Background-refresh an expired, previously synced catalog at TUI startup.
# Set to 0 to disable.
auto_sync_days = 7
# Language precedence: --lang > RADIO_LANG > language > LC_ALL/LANG > en.
# language = "en" # or "zh-CN"
connect_timeout_secs = 5
request_timeout_secs = 20
playback_timeout_secs = 12

# Override automatic Radio Browser server discovery.
# api_url = "https://de1.api.radio-browser.info"

# Default: recordings/ under the application data directory.
# recording_dir = "/home/yourname/Music/radio-recordings"
