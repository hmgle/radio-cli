# Optional; omitted values use these defaults. Unknown keys are rejected.
# Full reference: docs/configuration.md (English) or docs/configuration.zh-CN.md.
mpv = "mpv"
ffmpeg = "ffmpeg"
ffprobe = "ffprobe"
volume = 80
# Playback-only adaptive level control; recordings remain stream copies.
# Uses dynaudnorm with a short window (f=150:g=5); adds some buffering.
# Filter support is cached per mpv executable for this process.
normalize_loudness = false
# Optional title cleanup for AsiaFM Cantonese only (UUID fb1a81c7-...).
# Removes the fixed station watermark and marks damaged fields; no song guesses.
# Applies to playback titles and titles captured by subsequent recordings.
asiafm_metadata_patch = false
# Optional mpv output device; absent/empty uses automatic selection.
# Names depend on mpv's audio backend; list them with: radio devices
# Local player/device failures end playback without stream URL fallback.
# audio_device = "pulse/your-device-name"
# false: fresh start; true: restore source and play the last station.
# "selection": restore source and station selection without starting audio.
# Volume is always remembered.
resume = false
# Background-refresh an expired, previously synced catalog at TUI startup.
# Set to 0 to disable.
auto_sync_days = 7
# Language precedence: --lang > RADIO_LANG > language > LC_ALL/LANG > en.
# language = "en" # or "zh-CN"
connect_timeout_secs = 5
request_timeout_secs = 20
playback_timeout_secs = 12

# Override automatic Radio Browser server discovery.
# api_url = "https://de1.api.radio-browser.info"

# Default: recordings/ under the application data directory.
# recording_dir = "/home/yourname/Music/radio-recordings"

# Independent recording codec-probe budget (1-300 seconds).
probe_timeout_secs = 5
# Positive MiB reserve plus estimated audio bitrate x duration.
# Unknown bitrate or unlimited duration: reserve only; total size is unknown.
recording_min_free_mb = 16
# default | mono | light; nonempty NO_COLOR forces mono.
theme = "default"
# off | station | track. Optional details-panel images; default off.
# station: catalog logos, populated by sync after upgrading.
# track: prefer ICY track covers, then catalog logos.
# Track probing can count as another listener; it runs only for the playing
# station shown in details. Recording cancels it and shows logos instead.
# Monochrome and narrow/short layouts remain text-only. Compatible tmux builds
# use native Sixel; other tmux sessions fall back to half blocks.
artwork = "off"
# false permits the terminal's native text selection.
mouse = true

# Normal-mode shortcut: 1-4 printable keys, or one named key.
# Examples: "''", "gp", "<F6>", "<Ctrl-p>". Ctrl-c is reserved for exit.
# Set to "" to disable the shortcut.
# A binding takes precedence over existing normal-mode shortcuts.
[keybindings]
jump_to_playing = "''"

# Optional TUI live captions; installation is explicit (see configuration docs).
[subtitles]
enabled = false
model = "sensevoice-small-int8" # alternative: "qwen3-asr-0.6b-int8"; legacy: "sensevoice-small-yue-int8"
language = "auto" # upstream SenseVoice: auto/zh/yue/en/ja/ko; legacy ignores it; Qwen3: auto only
threads = 0 # automatic: half the logical cores, capped at four; explicit: 1–32
max_segment_secs = 8 # 2–20; VAD may include a short trailing pause
uv = "uv"
# Optional mirror: <base>/<model-id>/<file-path>; official source is fallback.
# model_mirror = "https://mirror.example.com/radio-models/"
