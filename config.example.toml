# Optional; omitted values use these defaults.
mpv = "mpv"
ffmpeg = "ffmpeg"
ffprobe = "ffprobe"
volume = 80
# Playback-only adaptive level control; recordings remain stream copies.
# Uses dynaudnorm with a short window (f=150:g=5); adds some buffering.
normalize_loudness = false
# Optional mpv output device; absent/empty uses automatic selection.
# Names depend on mpv's audio backend; list them with: radio devices
# audio_device = "pulse/your-device-name"
# false: fresh start; true: restore source and play the last station.
# "selection": restore source and station selection without starting audio.
# Volume is always remembered.
resume = false
# Background-refresh an expired, previously synced catalog at TUI startup.
# Set to 0 to disable.
auto_sync_days = 7
# Language precedence: --lang > RADIO_LANG > language > LC_ALL/LANG > en.
# language = "en" # or "zh-CN"
connect_timeout_secs = 5
request_timeout_secs = 20
playback_timeout_secs = 12

# Override automatic Radio Browser server discovery.
# api_url = "https://de1.api.radio-browser.info"

# Default: recordings/ under the application data directory.
# recording_dir = "/home/yourname/Music/radio-recordings"

# Independent recording codec-probe budget (1-300 seconds).
probe_timeout_secs = 5
# Positive MiB reserve plus estimated audio bitrate x duration.
# Unknown bitrate or unlimited duration: reserve only; total size is unknown.
recording_min_free_mb = 16
# default | mono | light; nonempty NO_COLOR forces mono.
theme = "default"
# false permits the terminal's native text selection.
mouse = true

# Normal-mode shortcut: 1-4 printable keys, or one named key.
# Examples: "''", "gp", "<F6>", "<Ctrl-p>". Ctrl-c is reserved for exit.
# Set to "" to disable the shortcut.
# A binding takes precedence over existing normal-mode shortcuts.
[keybindings]
jump_to_playing = "''"
