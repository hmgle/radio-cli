core_help_notice = "List: PgUp/PgDn changes database pages; gg/G and Home/End select within the page.\nRecordings: Enter or double-click plays; station search/filter/favorite keys do not apply.\nWheel: list moves three items; help scrolls; filters choose candidates.\nUnder 20 rows: 5 opens task details, 2 returns to the list.\nFailed list: automatic retries back off from 500ms to 30s; F5 retries immediately, Enter shows the full error.\nDeletion: y confirms; Enter/n/Esc/q cancel; Ctrl-C quits.\nFilter popup: Ctrl-U clears search and filters immediately; the explicit Clear label does the same.\nOperation error: ? shows details; Esc dismisses in normal mode."

