tui_help = "NORMAL mode\nTab / Shift-Tab  Switch panels     1–5  Focus a panel\nCtrl-h/j/k/l or Ctrl-arrows  Move focus spatially\n[ / ] Switch category     j/k, arrows  Navigate/scroll\ngg / G  First/last item     Ctrl-u/d  Move ten items\nEnter  Play the selected item (open the list from sources)\nSpace pause  m mute  n random  f favorite  r record  +/- volume\ny copy UUID/recording ID · Y copy URL/file path (OSC 52)\n/  Search (Enter confirms, Esc restores the original search)\nF  Filters (type to narrow · Up/Down candidates · Tab field)\nFilter Ctrl-U clears search and filters     F5 refresh     ? help     q / Ctrl-C quit\n\nCOMMAND mode\n: Enter a command; Enter executes; Esc returns; Ctrl-C finalizes and quits\nTab / Shift-Tab completion; Up/Down history; Left/Right cursor\nHome / Ctrl-a start; End / Ctrl-e end; Ctrl-u clear\n\n:sync [--accept-shrink]  Sync catalog in the background\n:refresh                Refresh the current list\n:sync-cancel            Cancel sync and keep the previous catalog\n:search jazz --country FR --min-bitrate 128\n:play [UUID|URL]        Play the selection, UUID or stream URL\n:random [search options] Reuse the current filters without arguments\n:info [UUID]            Inspect a station\n:current                Inspect the playing station\n:favorites list|add|remove [UUID]\n:history                Recent plays\n:recordings list        Recording records\nRecordings: Enter play · D delete (y confirms) · o folder · e errors\n:recordings play ID / :recordings remove ID [--index-only]\n:open recordings        Open the recording directory\n:station add 'My Station' https://example.com/live\n:station list / :station edit UUID --name NAME --url URL\n:station remove UUID [--keep-references]  y confirms deletion\n:station backups UUID [--add URL] [--remove URL]\n:record [UUID] [--duration 30m] [--output-dir DIR]\n:record stop            Finalize recording\n:pause / :mute / :stop / :volume 70\n:help record            CLI command usage\n:set language en|zh-CN  Switch UI language\n:set mouse true|false   Capture the mouse; false allows terminal selection\nThe last 100 commands persist in command-history.json in the data directory\n:doctor                 Check media tools and directory permissions\n:focus sources|list|details|player|activity\n:quit / :q              Finalize and quit\n\nCommands invoke built-in operations without a shell. Input supports quoting and Unicode.\nBitrate/codec come from the catalog and may be stale; the player handles actual audio.\nEsc / ? / q close help; j/k, PgUp/PgDn, Home/End, g/G, Ctrl-e/y/b/f scroll."

